name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/run.py
        env:
          CXX: clang++
  avr-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.19
      - name: Compile synth example on Uno and Mega
        run: pio run
      - name: Compile every MLX90614 sketch
        working-directory: MLX90614
        run: pio run -e get_communication_mode -e get_to_target_temp -e print_all_registers -e read_temp_I2C -e read_temp_PWM -e set_emissivity -e set_temp_limits -e switch_to_I2C -e switch_to_PWM
      - name: Compile PT100 sketch
        working-directory: E3D PT100 Amplifier
        run: pio run
